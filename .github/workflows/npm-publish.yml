name: Publish NPM

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (required for OIDC provenance)
        run: npm install -g npm@11.12.1

      - name: Install dependencies
        run: npm install

      - name: Prepare Package (Copy Assets)
        run: |
          echo "Copying README and LICENSE to core package..."
          cp README.md packages/core/
          cp LICENSE packages/core/
          ls -la packages/core/

      - name: Publish to npm
        run: npm publish ./packages/core --access public --provenance